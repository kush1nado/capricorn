# Capricorn — конфигурация.
# Скопируй в ~/.config/capricorn/config.yaml или в ./capricorn.yaml в корне репозитория.
# ${VAR} подставляется из переменных окружения.
# ID моделей меняются часто — сверяй с документацией провайдера.

language: ru            # на каком языке общаются агенты
default_target: manager # кому уходит сообщение без @упоминания
budget: 30              # макс. ходов агентов на одну твою задачу (защита от бесконечных споров)
max_history: 40         # сколько последних сообщений агент держит в контексте
complex_mode: false     # true = включён третий кодер (переключается /complex)

tools:                  # инструменты агентов: работают с репозиторием, где запущен capricorn
  enabled: true
  write: true           # write_file / edit_file (кодеры, тестировщик)
  run_tests: true
  test_command: python -m pytest -q   # строка или список: [npm, test]
  test_timeout: 300     # секунд
  max_rounds: 12        # раундов «модель → инструменты» за один ход
  worktrees: true       # у каждого кодера и тестировщика своя ветка и git worktree

providers:
  anthropic:
    type: anthropic
    api_key: ${ANTHROPIC_API_KEY}
  openai:
    type: openai
    base_url: https://api.openai.com/v1
    api_key: ${OPENAI_API_KEY}
  deepseek:
    type: openai
    base_url: https://api.deepseek.com/v1
    api_key: ${DEEPSEEK_API_KEY}
  qwen:                 # Alibaba DashScope, OpenAI-совместимый режим
    type: openai
    base_url: https://dashscope-intl.aliyuncs.com/compatible-mode/v1
    api_key: ${DASHSCOPE_API_KEY}
  minimax:
    type: openai
    base_url: https://api.minimax.io/v1
    api_key: ${MINIMAX_API_KEY}
  openrouter:           # один ключ — сотни моделей
    type: openai
    base_url: https://openrouter.ai/api/v1
    api_key: ${OPENROUTER_API_KEY}
  ollama:               # локально
    type: openai
    base_url: http://localhost:11434/v1
    api_key: ollama
  lmstudio:
    type: openai
    base_url: http://localhost:1234/v1
    api_key: lm-studio
  mock:                 # офлайн-заглушка для проверки интерфейса
    type: mock
  # Агенты-CLI под твоей подпиской, без ключей API. У них свои инструменты (файлы, shell);
  # модель: codex/default или codex/<id>, claude-code/default или claude-code/sonnet.
  codex:                # Codex CLI (подписка ChatGPT); на Windows найдётся и в установке приложения Codex
    type: codex
    # command: C:\path\to\codex.exe
  claude-code:          # Claude Code CLI (подписка Claude); сначала: claude → /login
    type: claude-code

# model: "<провайдер>/<id модели>"
agents:
  architect:
    model: anthropic/claude-opus-5-5
    temperature: 0.4
  manager:
    model: openai/gpt-5-mini
    observe_all: true   # видит всю переписку как контекст (не тратит ход)
  coder1:
    model: deepseek/deepseek-chat
  coder2:
    model: qwen/qwen3-coder-plus
  coder3:
    model: ollama/qwen2.5-coder:14b
  reviewer:
    model: anthropic/claude-sonnet-5-5
    temperature: 0.2
  tester:
    model: minimax/MiniMax-M2
  # Любой агент: max_tokens, temperature, extra_prompt (дописывается к системному промпту),
  # tools: [read_file, git_diff] — свой набор инструментов вместо набора по роли
