[project]
name = "capricorn"
dynamic = ["version"]
description = "Мультиагентная среда разработки: архитектор, менеджер, кодеры, ревьюер, тестировщик — на любых моделях; в терминале, браузере или отдельном окне"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "textual>=0.80",
    "textual-serve>=1.1",   # --web
    "httpx>=0.27",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
desktop = [
    "pywebview>=5",         # --desktop (Linux: ещё системные GTK или Qt, см. README)
]
build = [
    "pyinstaller>=6.10",
]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
]

[project.scripts]
capricorn = "capricorn.__main__:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.dynamic]
version = { attr = "capricorn.__version__" }

[tool.setuptools.packages.find]
include = ["capricorn*"]

[tool.setuptools.package-data]
capricorn = ["*.tcss", "web_assets/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
