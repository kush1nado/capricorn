[project]
name = "capricorn"
dynamic = ["version"]
description = "Мультиагентная среда разработки в терминале: архитектор, менеджер, кодеры, ревьюер, тестировщик — на любых моделях"
requires-python = ">=3.10"
dependencies = [
    "textual>=0.80",
    "httpx>=0.27",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
]

[project.scripts]
capricorn = "capricorn.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.dynamic]
version = { attr = "capricorn.__version__" }

[tool.setuptools.packages.find]
include = ["capricorn*"]

[tool.setuptools.package-data]
capricorn = ["*.tcss"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
