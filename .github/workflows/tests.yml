name: tests

on:
  push:
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }} · py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Test
        run: python -m pytest -q

  build:
    name: build · ${{ matrix.os }}
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: python -m pip install -e ".[desktop,build]"
      - name: Build and smoke-test
        run: python scripts/build.py
      - name: Pack
        # tar сохраняет права на исполнение и симлинки (важно для .app), upload-artifact сам их теряет
        shell: bash
        run: tar -czf "Capricorn-${{ runner.os }}.tar.gz" -C dist .
      - uses: actions/upload-artifact@v4
        with:
          name: Capricorn-${{ runner.os }}
          path: Capricorn-${{ runner.os }}.tar.gz
          retention-days: 14
